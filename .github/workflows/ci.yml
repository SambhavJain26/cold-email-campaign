name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coldemail
          POSTGRES_PASSWORD: coldemail_dev
          POSTGRES_DB: coldemail
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U coldemail -d coldemail"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://coldemail:coldemail_dev@localhost:5433/coldemail
      TEST_DATABASE_URL: postgres://coldemail:coldemail_dev@localhost:5433/coldemail_test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Create test database (service containers skip initdb mounts)
        run: PGPASSWORD=coldemail_dev psql -h localhost -p 5433 -U coldemail -d coldemail -c 'CREATE DATABASE coldemail_test'

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

      - name: Migration drill (apply -> rollback -> apply)
        run: |
          npm run db:migrate
          npm run db:rollback
          npm run db:migrate

      - run: npx vitest run --project unit --project integration

      # docs/13 §6 ordering: API tests after unit+integration (shared serial test DB).
      - run: npx vitest run --project api

      # B7.2 restore drill: seed the golden cohort into a fresh DB, then replay
      # the disaster-recovery runbook - dump → restore → rebuild → dry-run (0
      # diffs) → self-check (0 violations). Proves backups are restorable, not
      # just present (docs/16 §3).
      - name: Restore drill (B7.2)
        run: |
          PGPASSWORD=coldemail_dev psql -h localhost -p 5433 -U coldemail -d coldemail -c 'CREATE DATABASE coldemail_drill'
          npx tsx apps/server/test/ops/seed-golden.ts postgres://coldemail:coldemail_dev@localhost:5433/coldemail_drill
          DATABASE_URL=postgres://coldemail:coldemail_dev@localhost:5433/coldemail_drill \
            BACKUP_DIR="$RUNNER_TEMP/coldemail-backups" \
            SCRATCH_DB=coldemail_drill_scratch \
            bash scripts/restore-drill.sh

  # F0.7: web track - component tests (jsdom) + mock-mode Playwright e2e.
  # No Postgres: MSW serves the golden fixtures (docs/11 §4).
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @coldemail/web
      - run: npx vitest run --project web
      - run: npx playwright install chromium --with-deps
        working-directory: apps/web
      - run: npm run e2e -w @coldemail/web
        env:
          CI: 'true'

  # B8.1: the live SmtpImapTransport against a REAL SMTP+IMAP server (GreenMail)
  # plus Postgres - send, IMAP fetch with the UID high-water mark, DSN/OOO/reply
  # parsing, and a full scheduler+poller run over the live transport. No real
  # mailboxes and no accounts, so it runs on every push like any other suite.
  mail:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coldemail
          POSTGRES_PASSWORD: coldemail_dev
          POSTGRES_DB: coldemail
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U coldemail -d coldemail"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      greenmail:
        image: greenmail/standalone:2.1.10
        env:
          # Same accounts as docker-compose.yml; login is the full address.
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.all
            -Dgreenmail.hostname=0.0.0.0
            -Dgreenmail.users=canary@coldemail.test:canarypw,second@coldemail.test:secondpw,seed@lead.test:seedpw,mailer-daemon@mx.coldemail.test:daemonpw
        ports: ['3025:3025', '3143:3143', '18080:8080']
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3025 && exec 4<>/dev/tcp/127.0.0.1/3143'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://coldemail:coldemail_dev@localhost:5433/coldemail_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: PGPASSWORD=coldemail_dev psql -h localhost -p 5433 -U coldemail -d coldemail -c 'CREATE DATABASE coldemail_test'
      - run: npx vitest run --project mail

  # The locked regression (docs/13 §3). Required. Red here = the math stopped closing.
  golden:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coldemail
          POSTGRES_PASSWORD: coldemail_dev
          POSTGRES_DB: coldemail
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U coldemail -d coldemail"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://coldemail:coldemail_dev@localhost:5433/coldemail_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: PGPASSWORD=coldemail_dev psql -h localhost -p 5433 -U coldemail -d coldemail -c 'CREATE DATABASE coldemail_test'
      - run: npm run test:golden

  # The real-backend walkthrough replay (docs/13 §5) - the M3 closer. Drives the
  # web UI against the real Fastify server in SIMULATED_CLOCK mode over
  # MockTransport + advance-clock. The Playwright config boots both servers.
  e2e-real:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coldemail
          POSTGRES_PASSWORD: coldemail_dev
          POSTGRES_DB: coldemail
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U coldemail -d coldemail"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://coldemail:coldemail_dev@localhost:5433/coldemail_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: PGPASSWORD=coldemail_dev psql -h localhost -p 5433 -U coldemail -d coldemail -c 'CREATE DATABASE coldemail_test'
      - run: npx playwright install chromium --with-deps
        working-directory: apps/web
      - run: npm run e2e:real -w @coldemail/web
        env:
          CI: 'true'
